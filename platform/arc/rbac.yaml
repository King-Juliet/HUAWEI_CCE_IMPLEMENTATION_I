# What ARC's runner (and per-step job) pods are actually allowed to do — deliberately
# scoped to the "default" namespace and the resources a deploy pipeline touches, not
# cluster-admin. This is the RBAC layer that k8s/ never had until now.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: imto-arc-runner-sa
  namespace: arc-runners
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: imto-deployer
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["secrets-store.csi.x-k8s.io"]
    resources: ["secretproviderclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Explicitly NOT granted: write access to Secrets (credentials arrive via CSMS/dew-provider,
  # never via a pipeline-written K8s Secret), anything in envoy-gateway-system (the Gateway
  # itself), and any cluster-scoped resource.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: imto-deployer-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: imto-arc-runner-sa
    namespace: arc-runners
roleRef:
  kind: Role
  name: imto-deployer
  apiGroup: rbac.authorization.k8s.io
