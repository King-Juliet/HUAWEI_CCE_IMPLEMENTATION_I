name: CD - Build, Push, Deploy

on:
  workflow_run:
    workflows: ["CI - Terraform Infrastructure"]
    types: [completed]
    branches: [main]

# One CD run at a time: they all read and write the same Terraform state.
concurrency:
  group: cd-main-v2
  cancel-in-progress: false

env:
  SWR_REGISTRY: swr.af-south-1.myhuaweicloud.com
  SWR_ORGANIZATION: juliet-cce
  TF_WORKING_DIR: af_south_1
  ARC_VERSION: 0.15.0
  ENVOY_GATEWAY_VERSION: v1.9.2

jobs:
  terraform-apply:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      swr_project_name: ${{ steps.project_name.outputs.value }}
      bootstrap_arc: ${{ steps.arc.outputs.install }}
      elb_id: ${{ steps.elb.outputs.value }}
    env:
      HW_ACCESS_KEY: ${{ secrets.HW_ACCESS_KEY }}
      HW_SECRET_KEY: ${{ secrets.HW_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HW_SECRET_KEY }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Download Terraform plan from CI run
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      # ARC (the in-cluster runner that performs `deploy`) is installed automatically when
      # (a) this run is creating the cluster, or (b) the commit changed platform/arc/.
      # Every other run skips the install, so the API server stays private.
      - name: Decide whether ARC must be installed
        id: arc
        run: |
          INSTALL=false
          if [ "${{ steps.download.outcome }}" = "success" ]; then
            if (cd "$TF_WORKING_DIR" && terraform show -json tfplan) \
               | jq -e '[.resource_changes[]? | select(.type=="huaweicloud_cce_autopilot_cluster") | select(.change.actions | index("create"))] | length > 0' > /dev/null; then
              echo "Plan creates the cluster -> ARC install needed."
              INSTALL=true
            fi
          fi
          if git diff-tree --no-commit-id --name-only -r "${{ github.event.workflow_run.head_sha }}" | grep -q '^platform/arc/'; then
            echo "platform/arc/ changed in this commit -> ARC install needed."
            INSTALL=true
          fi
          echo "install=$INSTALL" >> "$GITHUB_OUTPUT"

      # A failed ARC bootstrap can leave the temporary API IP attached to the cluster. If one is
      # found in state, detach it from the cluster first (the IP is kept for that apply), then
      # delete it, retrying while Huawei finishes the detach. This changes state, so the saved
      # plan from CI is stale afterwards and the next step applies a fresh plan instead.
      - name: Clean up leftover temporary API access
        id: leftover
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          CLEANED=false
          if terraform state list | grep -q '^huaweicloud_vpc_eip\.api_temp'; then
            echo "Leftover temporary API IP found - detaching it from the cluster first."
            terraform apply -auto-approve -var="keep_temp_eip=true"
            DONE=false
            for i in $(seq 1 10); do
              if terraform apply -auto-approve; then DONE=true; break; fi
              echo "EIP still busy, retrying ($i/10)"; sleep 30
            done
            [ "$DONE" = "true" ] || { echo "::error::could not delete the temporary API IP"; exit 1; }
            CLEANED=true
          fi
          echo "cleaned=$CLEANED" >> "$GITHUB_OUTPUT"

      # If a previous run left the temporary API IP half-detached, the saved plan can fail with
      # a "conflict" while Huawei finishes detaching it. Wait a minute and apply once more with a
      # fresh plan, which sees the real current state.
      - name: Terraform apply
        if: steps.download.outcome == 'success'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          if [ "${{ steps.leftover.outputs.cleaned }}" = "true" ]; then
            echo "State changed during cleanup - saved plan is stale, applying a fresh plan."
            terraform apply -auto-approve
          else
            terraform apply -auto-approve tfplan || {
              echo "Saved plan failed - waiting 60s, then retrying with a fresh plan."
              sleep 60
              terraform apply -auto-approve
            }
          fi

      - name: Read SWR login project name from Terraform state
        id: project_name
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e
          NAME=$(terraform output -raw swr_login_project_name)
          [ -n "$NAME" ] || { echo "::error::swr_login_project_name output is empty"; exit 1; }
          echo "value=$NAME" >> "$GITHUB_OUTPUT"

      # The ELB this stack created. The deploy job writes this id into the Envoy Gateway manifest so
      # the Gateway's Service attaches to the right load balancer.
      - name: Read ELB id from Terraform state
        id: elb
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e
          ID=$(terraform output -raw elb_id)
          [ -n "$ID" ] || { echo "::error::elb_id output is empty"; exit 1; }
          echo "value=$ID" >> "$GITHUB_OUTPUT"

      # If an apply ever fails to save state again, this keeps the file instead of losing
      # it with the runner. It contains your generated DB passwords in plain text, so it
      # is kept for 1 day only. Download it, then run `terraform state push errored.tfstate`.
      - name: Keep errored state if it could not be saved
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: errored-tfstate
          path: ${{ env.TF_WORKING_DIR }}/errored.tfstate
          retention-days: 1

  build-and-push:
    needs: terraform-apply
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute image tag
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute SWR login credentials
        id: swr_auth
        env:
          HW_ACCESS_KEY: ${{ secrets.HW_ACCESS_KEY }}
          HW_SECRET_KEY: ${{ secrets.HW_SECRET_KEY }}
          SWR_PROJECT_NAME: ${{ needs.terraform-apply.outputs.swr_project_name }}
        run: |
          LOGIN_KEY=$(printf "%s" "$HW_ACCESS_KEY" | openssl dgst -binary -sha256 -hmac "$HW_SECRET_KEY" | od -An -vtx1 | sed 's/[ \n]//g' | sed 'N;s/\n//')
          echo "::add-mask::$LOGIN_KEY"
          echo "username=${SWR_PROJECT_NAME}@${HW_ACCESS_KEY}" >> "$GITHUB_OUTPUT"
          echo "password=$LOGIN_KEY" >> "$GITHUB_OUTPUT"

      - name: Log in to SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ steps.swr_auth.outputs.username }}
          password: ${{ steps.swr_auth.outputs.password }}

      - name: Build and push ${{ matrix.component }} image
        uses: docker/build-push-action@v6
        with:
          context: test_app/${{ matrix.component }}
          file: test_app/${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORGANIZATION }}/imto-test-${{ matrix.component }}:${{ steps.vars.outputs.tag }}

  arc-bootstrap:
    needs: terraform-apply
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      needs.terraform-apply.outputs.bootstrap_arc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      HW_ACCESS_KEY: ${{ secrets.HW_ACCESS_KEY }}
      HW_SECRET_KEY: ${{ secrets.HW_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HW_SECRET_KEY }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      # The cluster API server is private. For the duration of this job only, Terraform binds a
      # temporary EIP to it so this GitHub-hosted runner can reach it. The last step of the job
      # (which always runs) applies again with the default value and removes the EIP.
      - name: Open temporary API access
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -var="cluster_public_access=true"

      - name: Fetch short-lived kubeconfig
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e
          terraform output -raw bootstrap_kubeconfig > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          [ -s "$RUNNER_TEMP/kubeconfig" ] || { echo "::error::kubeconfig is empty - the cluster certificate data source returned nothing"; exit 1; }
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Wait for the API server to answer
        run: |
          kubectl config get-contexts
          kubectl config use-context external
          OK=0
          for i in $(seq 1 60); do
            if kubectl get --raw /readyz > /dev/null 2>&1 && kubectl get --raw /openapi/v2 > /dev/null 2>&1; then
              OK=$((OK+1))
              echo "API server answered ($OK/3)"
              [ "$OK" -ge 3 ] && exit 0
            else
              OK=0
              echo "not reachable yet ($i/60)"
            fi
            sleep 10
          done
          kubectl get --raw /readyz || true
          exit 1

      # Every cluster call below goes through retry(): the public API address sometimes refuses a
      # connection for a few seconds even right after answering, and one refused call must not fail
      # the whole bootstrap. Only connection errors are retried (see .github/scripts/retry.sh).
      - name: Create namespaces and GitHub credential secret
        env:
          ARC_GITHUB_TOKEN: ${{ secrets.ARC_GITHUB_TOKEN }}
        run: |
          set -e
          . .github/scripts/retry.sh
          [ -n "$ARC_GITHUB_TOKEN" ] || { echo "::error::repository secret ARC_GITHUB_TOKEN is missing"; exit 1; }
          retry bash -c 'kubectl create namespace arc-systems --dry-run=client -o yaml | kubectl apply -f -'
          retry bash -c 'kubectl create namespace arc-runners --dry-run=client -o yaml | kubectl apply -f -'
          # rbac.yaml grants Gateway permissions in this namespace, so it must exist first
          # (harmless if Envoy Gateway already created it).
          retry bash -c 'kubectl create namespace envoy-gateway-system --dry-run=client -o yaml | kubectl apply -f -'
          retry bash -c 'kubectl create secret generic imto-arc-github-app \
            --namespace arc-runners \
            --from-literal=github_token="$ARC_GITHUB_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -'

      - name: Apply runner RBAC
        run: |
          set -e
          . .github/scripts/retry.sh
          retry kubectl apply -f platform/arc/rbac.yaml

      - name: Install ARC controller
        run: |
          set -e
          . .github/scripts/retry.sh
          retry helm upgrade --install arc \
            --namespace arc-systems \
            -f platform/arc/controller-values.yaml \
            --version "$ARC_VERSION" \
            --wait --timeout 5m \
            oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller

      - name: Install ARC runner scale set
        run: |
          set -e
          . .github/scripts/retry.sh
          retry helm upgrade --install imto-arc-runners \
            --namespace arc-runners \
            -f platform/arc/runner-scale-set-values.yaml \
            --set githubConfigUrl="https://github.com/${{ github.repository }}" \
            --version "$ARC_VERSION" \
            oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set

      - name: Wait for the runner listener
        run: |
          for i in $(seq 1 30); do
            if kubectl get pods -n arc-systems --no-headers | grep listener | grep -q Running; then
              echo "ARC listener is running - runner scale set is registered with GitHub"
              kubectl get pods -A
              exit 0
            fi
            echo "listener not running yet ($i/30)"; sleep 10
          done
          kubectl get pods -A || true
          kubectl logs -n arc-systems -l app.kubernetes.io/name=gha-rs-controller --tail=80 || true
          exit 1

      # Envoy Gateway is not a Huawei add-on, so the pipeline installs it here (same temporary
      # access window). The chart brings the Gateway API CRDs with it, which the deploy job's
      # Gateway/HTTPRoute manifests need. Safe to re-run: helm upgrade --install.
      - name: Install Envoy Gateway
        run: |
          set -e
          . .github/scripts/retry.sh
          kubectl version | grep -i "server version" || true
          retry helm upgrade --install eg oci://docker.io/envoyproxy/gateway-helm \
            --version "$ENVOY_GATEWAY_VERSION" \
            --namespace envoy-gateway-system --create-namespace \
            --timeout 8m
          retry kubectl wait --timeout=5m -n envoy-gateway-system deployment/envoy-gateway --for=condition=Available

      # If anything above failed, print the cluster state into this log while access is still open.
      - name: Capture cluster diagnostics
        if: failure()
        run: bash .github/scripts/arc-diagnose.sh

      - name: Close temporary API access
        if: always()
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          rm -f "$RUNNER_TEMP/kubeconfig"
          # 1) detach the EIP from the cluster; keep_temp_eip stops Terraform deleting it in the same apply
          terraform apply -auto-approve -var="keep_temp_eip=true"
          # 2) then delete the now-unattached EIP; retry because the detach finishes in the background
          for i in $(seq 1 10); do
            if terraform apply -auto-approve; then
              echo "API server is private again."
              exit 0
            fi
            echo "EIP still busy, retrying ($i/10)"; sleep 30
          done
          exit 1

      - name: Keep errored state if it could not be saved
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: errored-tfstate-arc
          path: ${{ env.TF_WORKING_DIR }}/errored.tfstate
          retention-days: 1
          if-no-files-found: ignore

  # Watches the deploy job. The runner pod only exists once deploy is queued, and by then
  # arc-bootstrap has closed the API again, so this job does its own open -> capture -> close.
  # If deploy has not finished its first step within 8 minutes, it opens temporary API access,
  # prints pod status, events and logs into this job's log, then closes access again.
  # If deploy starts normally, this job ends within seconds and never touches the cluster.
  runner-diagnostics:
    needs: [terraform-apply, build-and-push, arc-bootstrap]
    if: >
      !cancelled() &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      needs.terraform-apply.result == 'success' &&
      needs.build-and-push.result == 'success' &&
      (needs.arc-bootstrap.result == 'success' || needs.arc-bootstrap.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      HW_ACCESS_KEY: ${{ secrets.HW_ACCESS_KEY }}
      HW_SECRET_KEY: ${{ secrets.HW_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HW_SECRET_KEY }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Wait for deploy to start on a runner
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs"
          for i in $(seq 1 24); do
            STATUS=$(gh api "$URL" --jq '.jobs[] | select(.name=="deploy") | .status')
            DONE=$(gh api "$URL" --jq '[.jobs[] | select(.name=="deploy") | .steps[]? | select(.status=="completed")] | length')
            echo "deploy status: ${STATUS:-unknown}, steps completed: ${DONE:-0} ($i/24)"
            if [ "$STATUS" = "completed" ] || [ "${DONE:-0}" -gt 0 ]; then
              echo "deploy is running or finished - no diagnostics needed."
              echo "stuck=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::deploy has not started running after 8 minutes - capturing cluster diagnostics."
          echo "stuck=true" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        if: steps.wait.outputs.stuck == 'true'
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Terraform init
        if: steps.wait.outputs.stuck == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Open temporary API access
        if: steps.wait.outputs.stuck == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -var="cluster_public_access=true"

      - name: Fetch short-lived kubeconfig
        if: steps.wait.outputs.stuck == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e
          terraform output -raw bootstrap_kubeconfig > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          [ -s "$RUNNER_TEMP/kubeconfig" ] || { echo "::error::kubeconfig is empty"; exit 1; }
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Wait for the API server to answer
        if: steps.wait.outputs.stuck == 'true'
        run: |
          kubectl config use-context external
          OK=0
          for i in $(seq 1 60); do
            if kubectl get --raw /readyz > /dev/null 2>&1 && kubectl get --raw /openapi/v2 > /dev/null 2>&1; then
              OK=$((OK+1))
              echo "API server answered ($OK/3)"
              [ "$OK" -ge 3 ] && exit 0
            else
              OK=0
              echo "not reachable yet ($i/60)"
            fi
            sleep 10
          done
          exit 1

      - name: Capture cluster diagnostics
        if: steps.wait.outputs.stuck == 'true'
        run: bash .github/scripts/arc-diagnose.sh

      - name: Close temporary API access
        if: always() && steps.wait.outputs.stuck == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          rm -f "$RUNNER_TEMP/kubeconfig"
          # 1) detach the EIP from the cluster; keep_temp_eip stops Terraform deleting it in the same apply
          terraform apply -auto-approve -var="keep_temp_eip=true"
          # 2) then delete the now-unattached EIP; retry because the detach finishes in the background
          for i in $(seq 1 10); do
            if terraform apply -auto-approve; then
              echo "API server is private again."
              exit 0
            fi
            echo "EIP still busy, retrying ($i/10)"; sleep 30
          done
          exit 1

  deploy:
    needs: [terraform-apply, build-and-push, arc-bootstrap]
    # arc-bootstrap is skipped on most runs; !cancelled() stops that skip from skipping deploy too,
    # and (unlike always()) it lets the Cancel button actually stop this job.
    if: >
      !cancelled() &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      needs.terraform-apply.result == 'success' &&
      needs.build-and-push.result == 'success' &&
      (needs.arc-bootstrap.result == 'success' || needs.arc-bootstrap.result == 'skipped')
    # Matches runnerScaleSetName in platform/arc/runner-scale-set-values.yaml — this job runs on
    # an ephemeral pod inside the CCE cluster itself, not a GitHub-hosted runner, which is
    # exactly what gives it network access to the private kube-apiserver.
    runs-on: imto-arc-runners
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
      KUBECTL_VERSION: v1.31.4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # No kubeconfig/credentials step needed here on purpose — the runner pod already
      # authenticates to this cluster's API server as imto-arc-runner-sa (platform/arc/rbac.yaml),
      # via the in-cluster kubernetes.default.svc endpoint. That's the whole point of ARC.
      #
      # The runner image ships without kubectl. Installed into the runner's temp dir (no root
      # needed) and checked against the official checksum. Needs outbound internet from the
      # pod; the cluster has SNAT enabled.
      - name: Install kubectl
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Fails here, clearly, if the runner pod has no permission to deploy (RBAC missing or
      # the pod is not running as imto-arc-runner-sa), instead of failing halfway through.
      - name: Check cluster access
        run: |
          kubectl version --client
          kubectl auth can-i create deployments -n default
          kubectl auth can-i create httproutes.gateway.networking.k8s.io -n default
          kubectl auth can-i list replicasets.apps -n default
          kubectl auth can-i create gateways.gateway.networking.k8s.io -n envoy-gateway-system
          kubectl auth can-i create gatewayclasses.gateway.networking.k8s.io

      # Inside the cluster, kubectl's default namespace is the one the runner pod lives in
      # (arc-runners), not "default". So every command that targets the app says -n default.
      # The Gateway/EnvoyProxy/HTTPRoute manifests already name their own namespace, so those
      # three applies must NOT pass -n (kubectl rejects a mismatch).
      - name: Pin manifests to this build's image tag
        run: |
          set -e
          BACKEND_IMAGE="${SWR_REGISTRY}/${SWR_ORGANIZATION}/imto-test-backend"
          FRONTEND_IMAGE="${SWR_REGISTRY}/${SWR_ORGANIZATION}/imto-test-frontend"

          grep -q "${BACKEND_IMAGE}:latest" k8s/backend-deployments.yaml \
            || { echo "::error::expected image '${BACKEND_IMAGE}:latest' not found in backend-deployments.yaml"; exit 1; }
          grep -q "${FRONTEND_IMAGE}:latest" k8s/frontend-deployment.yaml \
            || { echo "::error::expected image '${FRONTEND_IMAGE}:latest' not found in frontend-deployment.yaml"; exit 1; }

          sed -i "s#${BACKEND_IMAGE}:latest#${BACKEND_IMAGE}:${IMAGE_TAG}#" k8s/backend-deployments.yaml
          sed -i "s#${FRONTEND_IMAGE}:latest#${FRONTEND_IMAGE}:${IMAGE_TAG}#" k8s/frontend-deployment.yaml

      - name: Apply backend manifests
        run: |
          kubectl apply -n default -f k8s/backend-serviceaccount.yaml
          kubectl apply -n default -f k8s/backend-secretproviderclass.yaml
          kubectl apply -n default -f k8s/backend-deployments.yaml
          kubectl apply -n default -f k8s/backend-service.yaml
          kubectl apply -n default -f k8s/backend-hpa.yaml

      - name: Apply frontend manifests
        run: |
          kubectl apply -n default -f k8s/frontend-deployment.yaml
          kubectl apply -n default -f k8s/frontend-service.yaml

      # k8s/envoy-gatewayclass.yaml carries an ELB id. Replace it with the ELB this Terraform stack
      # actually manages, so it can never go stale.
      - name: Point Envoy Gateway at this stack's ELB
        env:
          ELB_ID: ${{ needs.terraform-apply.outputs.elb_id }}
        run: |
          set -e
          [ -n "$ELB_ID" ] || { echo "::error::elb_id from Terraform is empty"; exit 1; }
          grep -q 'kubernetes.io/elb.id:' k8s/envoy-gatewayclass.yaml \
            || { echo "::error::kubernetes.io/elb.id annotation not found in envoy-gatewayclass.yaml"; exit 1; }
          sed -i -E "s#(kubernetes.io/elb.id: )\"[^\"]*\"#\1\"${ELB_ID}\"#" k8s/envoy-gatewayclass.yaml
          grep 'kubernetes.io/elb.id' k8s/envoy-gatewayclass.yaml

      - name: Apply Envoy Gateway routing
        run: |
          kubectl apply -f k8s/envoy-gatewayclass.yaml
          kubectl apply -f k8s/envoy-gateway.yaml
          kubectl apply -f k8s/frontend-httproute.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/imto-test-backend -n default --timeout=120s
          kubectl rollout status deployment/imto-test-frontend -n default --timeout=120s

      # Only rolls back deployments that exist (on a first deploy there is nothing to roll back to).
      - name: Roll back on failed deploy
        if: failure()
        run: |
          for d in imto-test-backend imto-test-frontend; do
            if kubectl get deployment "$d" -n default > /dev/null 2>&1; then
              kubectl rollout undo "deployment/$d" -n default || true
            else
              echo "$d does not exist yet - nothing to roll back"
            fi
          done