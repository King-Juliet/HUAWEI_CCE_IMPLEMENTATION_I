name: CI - Terraform Infrastructure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TF_WORKING_DIR: af_south_1

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HW_ACCESS_KEY: ${{ secrets.HW_ACCESS_KEY }}
      HW_SECRET_KEY: ${{ secrets.HW_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HW_SECRET_KEY }}
      # Stops Terraform's S3 backend adding AWS-only upload checksums that OBS rejects
      # (XAmzContentSHA256Mismatch). Tested against OBS with a scratch state.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Pinned to the version you ran locally. A saved plan must also be applied by the
      # same Terraform version that created it, and CD runs minutes later.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Terraform fmt check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check

      - name: Terraform init (no backend)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Check if infrastructure files changed
        id: changes
        run: |
          if git diff --name-only ${{ github.event.before || 'HEAD^' }} ${{ github.sha }} \
             | grep -qE '^(af_south_1/|modules/)'; then
            echo "infra_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform init (with backend)
        if: steps.changes.outputs.infra_changed == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform plan
        if: steps.changes.outputs.infra_changed == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan

      - name: Upload Terraform plan
        if: steps.changes.outputs.infra_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1