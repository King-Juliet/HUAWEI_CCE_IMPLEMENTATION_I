apiVersion: v1
kind: ServiceAccount
metadata:
  name: imto-backend-sa
  annotations:
    # Declares which CSMS secret names this pod's ServiceAccount is allowed
    # to pull — nothing about the actual secret values lives here.
    # Must be a JSON array string, not comma-separated — confirmed against
    # Huawei's own CCE Secrets Manager for DEW docs (cce_10_0370.html).
    cce.io/dew-resource: '["imto-db-host","imto-db-port","imto-db-name","imto-db-user","imto-db-password"]'