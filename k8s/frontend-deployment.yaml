apiVersion: apps/v1
kind: Deployment
metadata:
  name: imto-test-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: imto-test-frontend
  template:
    metadata:
      labels:
        app: imto-test-frontend
    spec:
      imagePullSecrets:
        # Same reasoning as backend-deployments.yaml — the imto-test-frontend repo is also
        # private, so anonymous pulls get 401'd without this.
        - name: default-secret
      containers:
        - name: frontend
          image: swr.af-south-1.myhuaweicloud.com/juliet-cce/imto-test-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: BACKEND_URL
              # Internal Service DNS name — reachable only from inside the
              # cluster, resolved by Kubernetes' internal DNS.
              value: "http://imto-test-backend-svc:8080"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10