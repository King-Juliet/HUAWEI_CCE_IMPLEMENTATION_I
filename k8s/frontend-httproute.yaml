# Routes all traffic arriving at the Gateway (elb.tf's public ELB -> Envoy Gateway) to the
# frontend Service. The backend is intentionally NOT exposed via its own HTTPRoute — the
# frontend calls it server-side over the cluster-internal imto-test-backend-svc DNS name
# (see k8s/frontend-deployment.yaml's BACKEND_URL), so it never needs to be reachable from
# outside the cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: imto-frontend-route
  namespace: default
spec:
  parentRefs:
    - name: imto-gateway
      namespace: envoy-gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: imto-test-frontend-svc
          port: 3000
