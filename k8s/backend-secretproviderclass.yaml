apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: spc-imto-db
spec:
  provider: cce   # fixed value — tells the driver to use Huawei's CSMS provider
  parameters:
    objects: |
      - objectName: "imto-db-host"
        objectVersion: "latest"
        objectType: "csms"
      - objectName: "imto-db-port"
        objectVersion: "latest"
        objectType: "csms"
      - objectName: "imto-db-name"
        objectVersion: "latest"
        objectType: "csms"
      - objectName: "imto-db-user"
        objectVersion: "latest"
        objectType: "csms"
      - objectName: "imto-db-password"
        objectVersion: "latest"
        objectType: "csms"
  # secretObjects syncs the mounted CSMS values into a real Kubernetes
  # Secret, so the Deployment can keep using a normal envFrom/secretRef —
  # this is standard secrets-store-csi-driver behavior; verify it behaves
  # identically with Huawei's "cce" provider before relying on it for Prod.
  secretObjects:
    - secretName: imto-test-db-credentials-synced
      type: Opaque
      data:
        - objectName: "imto-db-host"
          key: DB_HOST
        - objectName: "imto-db-port"
          key: DB_PORT
        - objectName: "imto-db-name"
          key: DB_NAME
        - objectName: "imto-db-user"
          key: DB_USER
        - objectName: "imto-db-password"
          key: DB_PASSWORD