apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: imto-test-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: imto-test-backend
  minReplicas: 2
  maxReplicas: 6   # mirrors their current AWS Prod scaling range (2-6 tasks)
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # mirrors their current 70% CPU target